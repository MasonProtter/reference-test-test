name: CI

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  test-and-update-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      
      - name: Setup Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install deps
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Run script
        run: |
          JULIA_REFERENCETESTS_UPDATE=true julia --project=. script.jl
      
      - name: Check for image changes
        id: check_changes
        if: always()
        run: |
          git diff --quiet --exit-code || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Create PR with updated images
        if: always() && steps.check_changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a new branch for the image updates
          UPDATE_BRANCH="update-images-${{ github.head_ref }}-${{ github.run_number }}"
          git checkout -b "$UPDATE_BRANCH"
          
          # Commit the changes
          git add .
          git commit -m "Update generated images from CI
          
          Auto-generated by CI run #${{ github.run_number }}
          Original PR: #${{ github.event.pull_request.number }}"
          
          # Push the new branch
          git push origin "$UPDATE_BRANCH"
          
          # Create PR targeting the original PR's branch
          gh pr create \
            --base "${{ github.head_ref }}" \
            --head "$UPDATE_BRANCH" \
            --title "Update reference images for failing PR #${{ github.event.pull_request.number }}" \
            --body "This PR updates images generated during CI for PR #${{ github.event.pull_request.number }}.
          
          ## Instructions
          Review the image changes and **only** merge this PR into \`${{ github.head_ref }}\` if you agree these new images are appropriate.
          
          ---
          Auto-generated by [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
